name: Android Debug Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Test Rust core
        run: cargo test --workspace --locked
      - name: Build Rust Android JNI library
        shell: bash
        run: |
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/27.2.12479018"
          cargo ndk -t arm64-v8a -t x86_64 -o app/src/main/jniLibs build --release --locked -p pagemint-core
          test -s app/src/main/jniLibs/arm64-v8a/libpagemint_core.so
          test -s app/src/main/jniLibs/x86_64/libpagemint_core.so
      - name: Android unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PageMint-rust-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
